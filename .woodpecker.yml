steps:
  build:
    image: golang:1.25
    commands:
      - go build ./...

  vet:
    image: golang:1.25
    commands:
      - go vet ./...

  fmt:
    image: golang:1.25
    commands:
      - test -z "$(gofmt -l .)"

  test:
    image: golang:1.25
    commands:
      - go test -race -timeout 120s ./...

  vuln:
    image: golang:1.25
    commands:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - govulncheck ./...

  lint:
    image: golangci/golangci-lint:latest
    commands:
      - golangci-lint run ./...

  # Build the image and run the binary inside it with -version to confirm
  # the published runtime layer actually executes — the previous dry_run: true
  # step compiled an image and threw it away without ever running it, which
  # missed GLIBC version skew and missing CA-bundle bugs that compile-time
  # checks can't see.
  docker_build:
    image: docker:27
    commands:
      - docker build -t networkinventoryagent:ci .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  docker_smoke:
    image: docker:27
    commands:
      - docker run --rm networkinventoryagent:ci -version
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
