# GitHub Actions mirror of .woodpecker.yml — the Codeberg pipeline is the
# authoritative one (see CONTRIBUTING.md), this exists so contributors who
# open PRs against the GitHub mirror still get green/red feedback.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pre-empt the September 2026 Node.js 20 → 24 transition by opting in now.
# Without this, every action run in this workflow logs a deprecation banner
# and will hard-fail once Node 20 is removed from the runner image. See:
#   https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
      - run: go build ./...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
      - run: go vet ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
      - run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
      - run: go test -race -timeout 120s ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
      # Build golangci-lint from source with this job's Go toolchain rather
      # than pulling a prebuilt release binary. The golangci-lint-action's
      # prebuilt "latest" lagged the Go release and was built with an older
      # toolchain, which refuses to analyse a module that targets a newer Go
      # ("language version ... lower than the targeted Go version"). Building
      # it here keeps the linter's Go version in lockstep with the module's.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: golangci-lint run --timeout 5m ./...

  docker:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t networkinventoryagent:ci .
      - name: Smoke test image
        # The agent honours -version and exits 0 — confirms the binary
        # actually runs inside the published runtime layer (catches GLIBC
        # version skew, missing CA bundle, etc. that compile-time tests miss).
        run: docker run --rm networkinventoryagent:ci -version
