# Release pipeline. Triggers on `v*` tag push; cuts a GitHub Release with
# cross-platform binaries (linux/darwin/windows × amd64/arm64), a CycloneDX
# SBOM per archive, multi-arch Docker images on ghcr.io, and cosign
# keyless signatures for every artefact (binaries AND container manifests).
#
# To cut a release:
#   git tag vYY.NN
#   git push --tags github
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # for the GitHub Release upload
  id-token: write   # for cosign keyless OIDC signing
  packages: write

# Pre-empt the September 2026 Node.js 20 → 24 transition. See
# .github/workflows/ci.yml for the rationale.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser changelog wants full history

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@v0

      # QEMU lets the amd64 runner build linux/arm64 image layers.
      # Buildx is the modern build frontend that goreleaser's
      # `dockers:` block invokes via `docker buildx build`.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable cosign's TTY prompt; the action runs unattended.
          COSIGN_YES: 'true'
