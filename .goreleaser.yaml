# goreleaser configuration for NetworkInventoryAgent.
#
# Build matrix: linux/darwin/windows × amd64/arm64. All three binaries
# (agent, wintermute, neuromancer) ship in every archive so an operator can
# pick which one to run after downloading. CGO is disabled — modernc.org/sqlite
# is pure Go, so the resulting binaries are statically linked and portable.
#
# Triggered from .github/workflows/release.yml on a `v*` tag push. The same
# config doubles as a local `goreleaser release --snapshot --clean` for
# verifying the release-engineering pipeline without cutting an actual tag.

version: 2

project_name: networkinventoryagent

before:
  hooks:
    - go mod tidy

builds:
  - id: agent
    main: ./cmd/agent
    binary: agent
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Ronin48/NetworkInventoryAgent/cmd/internal/runtime.Version={{.Version}}
  - id: wintermute
    main: ./cmd/wintermute
    binary: wintermute
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Ronin48/NetworkInventoryAgent/cmd/internal/runtime.Version={{.Version}}
  - id: neuromancer
    main: ./cmd/neuromancer
    binary: neuromancer
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Ronin48/NetworkInventoryAgent/cmd/internal/runtime.Version={{.Version}}
  - id: console
    main: ./cmd/console
    binary: console
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Ronin48/NetworkInventoryAgent/cmd/internal/runtime.Version={{.Version}}

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md
      - CONTRIBUTING.md
      - ChangeLog.md
      - Planning.md
      - configs/*.json

# CycloneDX SBOM per archive — goreleaser invokes syft after building each
# archive; syft introspects the embedded Go binary's BuildInfo and emits a
# CycloneDX document. CI installs syft via anchore/sbom-action/download-syft.
sboms:
  - id: archive
    artifacts: archive
    cmd: syft
    args: ['$artifact', '--output', 'cyclonedx-json=$document']
    documents: ['${artifact}.cyclonedx.json']

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Per-arch Docker images published to GitHub Container Registry. Each
# build target consumes the matching goreleaser-produced binaries (no
# in-image rebuild), then docker_manifests stitches the per-arch tags
# into a single multi-arch :version tag operators can pull without
# knowing what their host arch is.
#
# `use: buildx` is required for the --platform flag; release.yml sets
# up QEMU before goreleaser runs so cross-arch builds succeed on the
# amd64 GitHub runner.
dockers:
  - image_templates:
      - 'ghcr.io/cryptojones/networkinventoryagent:{{ .Version }}-amd64'
      - 'ghcr.io/cryptojones/networkinventoryagent:latest-amd64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: amd64
    extra_files:
      - README.md
      - LICENSE
      - SECURITY.md
      - ChangeLog.md
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title=NetworkInventoryAgent
      - --label=org.opencontainers.image.description=Two-agent network inventory with mutual watchdog
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.source=https://github.com/CryptoJones/NetworkInventoryAgent
      - --label=org.opencontainers.image.licenses=Apache-2.0
  - image_templates:
      - 'ghcr.io/cryptojones/networkinventoryagent:{{ .Version }}-arm64'
      - 'ghcr.io/cryptojones/networkinventoryagent:latest-arm64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: arm64
    extra_files:
      - README.md
      - LICENSE
      - SECURITY.md
      - ChangeLog.md
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title=NetworkInventoryAgent
      - --label=org.opencontainers.image.description=Two-agent network inventory with mutual watchdog
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.source=https://github.com/CryptoJones/NetworkInventoryAgent
      - --label=org.opencontainers.image.licenses=Apache-2.0

docker_manifests:
  - name_template: 'ghcr.io/cryptojones/networkinventoryagent:{{ .Version }}'
    image_templates:
      - 'ghcr.io/cryptojones/networkinventoryagent:{{ .Version }}-amd64'
      - 'ghcr.io/cryptojones/networkinventoryagent:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/cryptojones/networkinventoryagent:latest'
    image_templates:
      - 'ghcr.io/cryptojones/networkinventoryagent:latest-amd64'
      - 'ghcr.io/cryptojones/networkinventoryagent:latest-arm64'

# cosign keyless OIDC signing for the published manifests. Uses the same
# Fulcio + Rekor flow as the binary signing in the `signs:` section.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - --yes
      - --oidc-issuer=https://token.actions.githubusercontent.com
      - ${artifact}

# cosign keyless OIDC signing. Requires GitHub Actions OIDC tokens, so this
# only works from the .github/workflows/release.yml job — never from a
# laptop. The transparency log entry is uploaded to Rekor by default.
#
# Both ${signature} and ${certificate} must be declared at this level for
# goreleaser to expand them in the args list; without `certificate:`
# declared, cosign would write to an empty filename and the README's
# verify-blob command would have no .pem to consume.
signs:
  - cmd: cosign
    artifacts: all
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    output: true
    args:
      - sign-blob
      - --yes
      - --oidc-issuer=https://token.actions.githubusercontent.com
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

snapshot:
  version_template: '{{ incpatch .Version }}-dev'

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

release:
  github:
    owner: CryptoJones
    name: NetworkInventoryAgent
  draft: false
  prerelease: auto
  header: |
    ## NetworkInventoryAgent {{ .Version }}

    Built from `{{ .ShortCommit }}`. Binaries are signed with [cosign](https://github.com/sigstore/cosign)
    using GitHub Actions OIDC; verify with:

    ```bash
    cosign verify-blob \
      --certificate-identity-regexp 'https://github.com/CryptoJones/NetworkInventoryAgent/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate <artifact>.pem \
      --signature   <artifact>.sig \
      <artifact>
    ```

    Each archive includes a CycloneDX SBOM (`sbom.cyclonedx.json`) listing every
    module the build pulled in.
