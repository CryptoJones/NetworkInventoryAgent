services:
  wintermute:
    build: .
    entrypoint: ["/usr/local/bin/wintermute"]
    command: ["-config", "/etc/inventory/config.json"]
    volumes:
      - wintermute-db:/data
      - ./configs/wintermute.docker.json:/etc/inventory/config.json:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  neuromancer:
    build: .
    entrypoint: ["/usr/local/bin/neuromancer"]
    command: ["-config", "/etc/inventory/config.json"]
    volumes:
      - neuromancer-db:/data
      - ./configs/neuromancer.docker.json:/etc/inventory/config.json:ro
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wintermute-db:
  neuromancer-db:
